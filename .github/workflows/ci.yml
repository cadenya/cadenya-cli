name: CI
on:
  push:
    branches:
      - '**'
      - '!integrated/**'
      - '!stl-preview-head/**'
      - '!stl-preview-base/**'
      - '!generated'
      - '!codegen/**'
      - 'codegen/stl/**'
  pull_request:
    branches-ignore:
      - 'stl-preview-head/**'
      - 'stl-preview-base/**'

env:
  GOPRIVATE: github.com/cadenya/cadenya-go,github.com/cadenya/cadenya-go-staging,github.com/stainless-sdks/cadenya-go

jobs:
  lint:
    timeout-minutes: 10
    name: lint
    runs-on: ${{ github.repository == 'stainless-sdks/cadenya-cli' && 'depot-ubuntu-24.04' || 'ubuntu-latest' }}
    if: (github.event_name == 'push' || github.event.pull_request.head.repo.fork) && (github.event_name != 'push' || github.event.head_commit.message != 'codegen metadata')

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The staging Go SDK repo is private; setup-go's accessibility check and any
      # module fetch against it need a token (GO_REPO_READ_TOKEN: Contents:Read on
      # cadenya/cadenya-go-staging). Inert on the public production repo.
      - name: Authenticate git for the private Go SDK repo
        if: github.repository == 'cadenya/cadenya-cli-staging'
        env:
          GO_REPO_READ_TOKEN: ${{ secrets.GO_REPO_READ_TOKEN }}
        run: |
          # Strip stray whitespace a paste can smuggle into the secret; log shape only.
          token="$(printf %s "$GO_REPO_READ_TOKEN" | tr -d '[:space:]')"
          echo "token length: ${#token} (raw: ${#GO_REPO_READ_TOKEN})"
          if ! git ls-remote --exit-code "https://x-access-token:${token}@github.com/cadenya/cadenya-go-staging" >/dev/null 2>&1; then
            echo "::error::GO_REPO_READ_TOKEN cannot read cadenya/cadenya-go-staging — check the token's resource owner (must be the cadenya org), repo selection, Contents:Read permission, and org approval state."
            exit 1
          fi
          git config --global "url.https://x-access-token:${token}@github.com/cadenya/cadenya-go-staging.insteadOf" "https://github.com/cadenya/cadenya-go-staging"

      - uses: ./.github/actions/setup-go
        with:
          stainless-api-key: ${{ secrets.STAINLESS_API_KEY }}

      - name: Link staging branch
        if: github.repository == 'stainless-sdks/cadenya-cli'
        run: |
          ./scripts/link 'github.com/stainless-sdks/cadenya-go@${{ github.ref_name }}' || true

      - name: Bootstrap
        run: ./scripts/bootstrap

      - name: Run lints
        run: ./scripts/lint

  build:
    timeout-minutes: 10
    name: build
    permissions:
      contents: read
      id-token: write
    runs-on: ${{ github.repository == 'stainless-sdks/cadenya-cli' && 'depot-ubuntu-24.04' || 'ubuntu-latest' }}
    if: (github.event_name == 'push' || github.event.pull_request.head.repo.fork) && (github.event_name != 'push' || github.event.head_commit.message != 'codegen metadata')
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The staging Go SDK repo is private; setup-go's accessibility check and any
      # module fetch against it need a token (GO_REPO_READ_TOKEN: Contents:Read on
      # cadenya/cadenya-go-staging). Inert on the public production repo.
      - name: Authenticate git for the private Go SDK repo
        if: github.repository == 'cadenya/cadenya-cli-staging'
        env:
          GO_REPO_READ_TOKEN: ${{ secrets.GO_REPO_READ_TOKEN }}
        run: |
          # Strip stray whitespace a paste can smuggle into the secret; log shape only.
          token="$(printf %s "$GO_REPO_READ_TOKEN" | tr -d '[:space:]')"
          echo "token length: ${#token} (raw: ${#GO_REPO_READ_TOKEN})"
          if ! git ls-remote --exit-code "https://x-access-token:${token}@github.com/cadenya/cadenya-go-staging" >/dev/null 2>&1; then
            echo "::error::GO_REPO_READ_TOKEN cannot read cadenya/cadenya-go-staging — check the token's resource owner (must be the cadenya org), repo selection, Contents:Read permission, and org approval state."
            exit 1
          fi
          git config --global "url.https://x-access-token:${token}@github.com/cadenya/cadenya-go-staging.insteadOf" "https://github.com/cadenya/cadenya-go-staging"

      - uses: ./.github/actions/setup-go
        with:
          stainless-api-key: ${{ secrets.STAINLESS_API_KEY }}

      - name: Link staging branch
        if: github.repository == 'stainless-sdks/cadenya-cli'
        run: |
          ./scripts/link 'github.com/stainless-sdks/cadenya-go@${{ github.ref_name }}' || true

      - name: Bootstrap
        run: ./scripts/bootstrap

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@9ed2f89a662bf1735a48bc8557fd212fa902bebf # v6.1.0
        with:
          version: latest
          args: release --snapshot --clean --skip=publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get GitHub OIDC Token
        if: |-
          github.repository == 'stainless-sdks/cadenya-cli' &&
          !startsWith(github.ref, 'refs/heads/stl/')
        id: github-oidc
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: core.setOutput('github_token', await core.getIDToken());

      - name: Upload tarball
        if: |-
          github.repository == 'stainless-sdks/cadenya-cli' &&
          !startsWith(github.ref, 'refs/heads/stl/')
        env:
          URL: https://pkg.stainless.com/s
          AUTH: ${{ steps.github-oidc.outputs.github_token }}
          SHA: ${{ github.sha }}
        run: ./scripts/utils/upload-artifact.sh

  test:
    timeout-minutes: 10
    name: test
    runs-on: ${{ github.repository == 'stainless-sdks/cadenya-cli' && 'depot-ubuntu-24.04' || 'ubuntu-latest' }}
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The staging Go SDK repo is private; setup-go's accessibility check and any
      # module fetch against it need a token (GO_REPO_READ_TOKEN: Contents:Read on
      # cadenya/cadenya-go-staging). Inert on the public production repo.
      - name: Authenticate git for the private Go SDK repo
        if: github.repository == 'cadenya/cadenya-cli-staging'
        env:
          GO_REPO_READ_TOKEN: ${{ secrets.GO_REPO_READ_TOKEN }}
        run: |
          # Strip stray whitespace a paste can smuggle into the secret; log shape only.
          token="$(printf %s "$GO_REPO_READ_TOKEN" | tr -d '[:space:]')"
          echo "token length: ${#token} (raw: ${#GO_REPO_READ_TOKEN})"
          if ! git ls-remote --exit-code "https://x-access-token:${token}@github.com/cadenya/cadenya-go-staging" >/dev/null 2>&1; then
            echo "::error::GO_REPO_READ_TOKEN cannot read cadenya/cadenya-go-staging — check the token's resource owner (must be the cadenya org), repo selection, Contents:Read permission, and org approval state."
            exit 1
          fi
          git config --global "url.https://x-access-token:${token}@github.com/cadenya/cadenya-go-staging.insteadOf" "https://github.com/cadenya/cadenya-go-staging"

      - uses: ./.github/actions/setup-go
        with:
          stainless-api-key: ${{ secrets.STAINLESS_API_KEY }}

      - name: Link staging branch
        if: github.repository == 'stainless-sdks/cadenya-cli'
        run: |
          ./scripts/link 'github.com/stainless-sdks/cadenya-go@${{ github.ref_name }}' || true

      - name: Bootstrap
        run: ./scripts/bootstrap

      - name: Run tests
        run: ./scripts/test
