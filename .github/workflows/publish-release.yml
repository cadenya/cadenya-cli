---
# Builds and publishes a tagged release. Tags are cut by release-please on the
# production repo (merging its "release: X.Y.Z" PR creates the tag + GitHub
# release with the changelog); this workflow attaches the artifacts:
#
#   goreleaser (ubuntu):  cross-compiled binaries for darwin/linux/windows,
#                         macOS signing + notarization (when the Apple secrets
#                         are set), tar.gz/zip archives + checksums, deb/rpm/apk,
#                         Homebrew cask pushed to cadenya/homebrew-tools.
#   chocolatey (windows): packs and pushes the Chocolatey package (needs
#                         choco.exe, hence the separate Windows runner); skipped
#                         until CHOCOLATEY_API_KEY is configured.
#
# Configuration lives in .github/goreleaser.yaml (see the note there on why).
name: Publish Release
permissions:
  contents: write

concurrency:
  group: publish

on:
  push:
    tags:
      - "v*"
  # Manual re-run for an existing tag: choose the tag as the ref.
  workflow_dispatch: {}

jobs:
  goreleaser:
    # Only the public production repo publishes; the staging repo never tags.
    if: github.repository == 'cadenya/cadenya-cli' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@9ed2f89a662bf1735a48bc8557fd212fa902bebf # v6.1.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --config .github/goreleaser.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Push access to cadenya/homebrew-tools.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          # macOS signing + notarization (anchore/quill). Leave unset to ship
          # unsigned darwin builds; goreleaser skips the notarize step when
          # MACOS_SIGN_P12 is empty.
          #   MACOS_SIGN_P12          base64 of the "Developer ID Application" .p12
          #   MACOS_SIGN_PASSWORD     password for that .p12
          #   MACOS_NOTARY_ISSUER_ID  App Store Connect API key issuer UUID
          #   MACOS_NOTARY_KEY_ID     App Store Connect API key ID
          #   MACOS_NOTARY_KEY        base64 of the AuthKey_<KEY_ID>.p8
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}

  chocolatey:
    needs: goreleaser
    if: github.repository == 'cadenya/cadenya-cli' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check for Chocolatey API key
        id: gate
        shell: bash
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        run: |
          if [ -z "${CHOCOLATEY_API_KEY}" ]; then
            echo "::notice::CHOCOLATEY_API_KEY is not configured — skipping the Chocolatey publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack and push the Chocolatey package
        if: steps.gate.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        run: .github/chocolatey/publish.ps1 -Tag "${{ github.ref_name }}"
