name: Release Please
on:
  push:
    branches:
      - main
  # Manual trigger for when a push event is lost (e.g. during a GitHub
  # Actions outage) and the release PR never gets opened.
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.repository == 'cadenya/cadenya-cli'
    runs-on: ubuntu-latest

    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
